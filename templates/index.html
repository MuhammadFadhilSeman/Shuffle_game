<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tongkrongan Card Game</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div id="start-overlay" class="start-overlay">
        <button id="start-btn" class="btn-spin">
            <span>MULAI MAIN</span>
        </button>
    </div>

    <div class="background-effects">
        <div class="glow glow-1"></div>
        <div class="glow glow-2"></div>
    </div>

    <main class="container">
        <header>
            <div class="lang-toggle-container">
                <span class="lang-label active" id="label-id">ID</span>
                <label class="switch">
                    <input type="checkbox" id="lang-toggle">
                    <span class="slider round"></span>
                </label>
                <span class="lang-label" id="label-en">EN</span>
            </div>
            <h1 class="title" id="main-title">Tanya <span class="highlight">Tongkrongan</span></h1>
            <p class="subtitle" id="main-subtitle">Pilih satu kartu!</p>
        </header>

        <section class="game-area">
            <div id="deck-container" class="deck-container hidden">
                <div class="deck-card deck-card-1"></div>
                <div class="deck-card deck-card-2"></div>
                <div class="deck-card deck-card-3"></div>
            </div>
            <div class="cards-container" id="cards-container">
                <!-- Cards injected by JS -->
            </div>
        </section>

        <div class="controls">
            <button id="deal-btn" class="btn-spin hidden">
                <span id="btn-text">SHUFFLE & DEAL</span>
                <div class="btn-glow"></div>
            </button>
        </div>
        
        <footer>
            <p class="footer-credit">Credit by <span class="highlight">Daigo</span></p>
        </footer>
    </main>

    <script src="{{ url_for('static', filename='script.js') }}"></script>
</body>
</html>
